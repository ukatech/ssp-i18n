name: sync translations from english

on:
  push:
    branches: [main]
    paths:
      - 'languages/english/message.txt'
      - 'languages/english/resource.rc'
      - 'languages/english/surfacetable.txt'
      - 'languages/english/install.txt'
      - 'shared/resource_r.h'
  workflow_dispatch:

concurrency:
  group: sync-translations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: fount-CI sync translations
    # Commits made by the semi-manual procedure in AGENTS.md opt out with [i18n-manual]
    # (the md5 update and the automatic release skip them too).
    if: ${{ !contains(github.event.head_commit.message, '[i18n-manual]') }}
    runs-on: windows-latest
    steps:
      - name: disable auto crlf
        uses: steve02081504/disable-autocrlf@v1
        with:
          fuck-auto-CRLF: true

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 7

      - name: run fount-CI agent
        uses: steve02081504/fount-CI@master
        with:
          task: |
            languages/english/ and languages/japanese/ are the two source-text locales (equal rank) in this SSP i18n monorepo.
            Use git log and git diff to inspect the latest languages/english/ changes relative to the previous commit.
            Sync equivalent changes into every translation target (locale folders without a .reference-only file):
            - message.txt: align keys with english; translate new or changed strings
            - resource.rc: mirror structural changes from languages/english/resource.rc; translate UI strings only
            - surfacetable.txt and install.txt: align structure when english changed
            Follow the translation rules in AGENTS.md (section 5).
            languages/japanese/ is source text, not a language pack (never modify, build or release it);
            translate from both english and japanese as described in AGENTS.md section 5.1.
            Folders containing a .reference-only file are never translation targets.
            Do not modify languages/english/, languages/japanese/, shared/resource_r.h, scripts/, or tools/.
            Run: python tools/i18n_check.py --min-level warn
            and fix every ERROR it reports for the locales you changed.
            When finished, run: pwsh ./scripts/build-resource.ps1
            Confirm every locale builds resource.dll successfully before exiting.
          max-steps: '200'
          max-time-seconds: '1800'
          commit-message: 'chore(i18n): sync translations from english update'
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
