name: rebuild resource.dll and updates.txt

# Manual only, and independent of the other workflows: builds resource.dll for
# every locale with rc.exe, regenerates updates.txt (tools/release.py) and
# commits both. Used by the semi-manual procedure in AGENTS.md when the
# translator has no Windows build tools.
on:
  workflow_dispatch:

concurrency:
  group: rebuild-dll-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    name: rebuild resource.dll and updates.txt
    runs-on: windows-latest
    steps:
      - name: disable auto crlf
        uses: steve02081504/disable-autocrlf@v1
        with:
          fuck-auto-CRLF: true

      - name: checkout
        uses: actions/checkout@v4

      - name: build resource.dll for all locales
        shell: pwsh
        run: ./scripts/build-resource.ps1

      - name: regenerate updates.txt
        shell: pwsh
        run: |
          python tools/release.py updates
          python tools/release.py verify

      - name: commit and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'languages/*/resource.dll' 'languages/*/updates.txt'
          if (git status --porcelain -- 'languages/*/resource.dll' 'languages/*/updates.txt') {
            # [i18n-manual]: keep the md5 update / auto release away from this commit
            git commit -m "chore: rebuild resource.dll and updates.txt [i18n-manual]"
            git push
          } else {
            Write-Host 'No resource.dll / updates.txt changes to commit.'
          }
